name: Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    schedule:
      # Runs every day at 02:00 UTC
      - cron: "0 2 * * *"
    workflow_dispatch:   # <-- enables manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - run: npm ci

      # 4️⃣ Start the app in the background
      - name: Start app
        run: npm run dev &

      # 5️⃣ Wait until the app is ready (e.g., on port 4200)
      - name: Wait for app to be ready
        run: npx wait-on http://localhost:4200

      # 6️⃣ Run Cypress tests
      - name: Run Cypress
        run: npx cypress run

      # 7️⃣ Upload Mochawesome report
      - name: Upload Cypress Report
        uses: actions/upload-artifact@v3
        with:
          name: cypress-report
          path: cypress/reports/
